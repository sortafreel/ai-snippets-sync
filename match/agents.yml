matches:
  - trigger: ":ask"
    replace: "Ask clarifying questions, if any, till crystal clear. Use \"/grilling\" skill (if you can't use skill directly - check its content/s installed). Don't ask multiple questions in a batch - ask them one by one with variants."
  - trigger: ":asg"
    replace: "Ask clarifying questions, if any, till crystal clear. Use \"/grilling\" skill. Don't ask multiple questions in a batch - ask them one by one with variants. Skills context (they aren't available locally, but opensource on GitHub):\n  - /grilling (https://github.com/mattpocock/skills/tree/main/skills/productivity/grilling)"
  - trigger: ":hand"
    replace: "Prepare an md doc (copy-pasteable text) to handoff this session to another agent to continue. Use \"/handoff\" skill (if you can't use skill directly - check its content/s installed)."
  - trigger: ":hang"
    replace: "Prepare an md doc (copy-pasteable text) to handoff this session to another agent to continue. Use \"/handoff\" skill. Skill context (it isn't available locally, but opensource on GitHub): https://github.com/mattpocock/skills/tree/main/skills/productivity/handoff"
  - trigger: ":hum"
    replace: "Use concise and simple human language. Don't use walls of text or highly specific jargon, as no human will read it. Don't drop important details."
  - trigger: ":look"
    replace: "Analyze the context, attached files/URLs, if any, and related codebase in detail to understand the task and its feasibility."
  - trigger: ":test"
    replace: "If applicable, add tests. Ensure to add only tests that test something, not mocks testing mocks."
  - trigger: ":init"
    replace: "## Context\n- \n\n## Concerns\n- \n\n## Task\n- "
  - trigger: ":ai-review"
    replace: "## Context\n- I'll send you AI code reviewer suggestions\n- I need you to access if they are valid or not\n- Skip if not, ask to code if valid\n- The AI reviewer will explicitly say they are valid, you should not trust it, and check for yourself\n- DON'T OVERENGINEER\n- Ask clarifying questions, if any, until crystal clear\n\nIs it clear?"
  - trigger: ":desc"
    replace: "- Generate a `/tmp` markdown file to describe the changes we did in this branch. Be meaningful, concise, use human language (as no human will read walls of text), avoid using filenames too much, and don't use **bold**.\n- Include a concise PR title\n- Include concise bulletpoint list of what was the problem\n- Include concise bulletpoint list of what were our changes"
  - trigger: ":A"
    replace: "ARCHITECTURE.md"
  - trigger: ":comment"
    replace: "Write only concise, meaningful comments, without any fluff or unnecessary details. Avoid comments >2 lines, except special cases where longer comments are truly justified. People will read it, so use human language. Write the comments that will lock the meaning of this part, not something that would need to be rewritten in 3 days. Avoid modifying comments commited not by you."
  - trigger: ":ntm"
    replace: "tmux new-session -A -s "